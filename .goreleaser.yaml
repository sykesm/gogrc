# Release builds: static binaries for macOS and Linux, published to GitHub
# Releases when a v* tag is pushed (see .github/workflows/release.yml).
# Try it locally with: goreleaser release --snapshot --clean
version: 2

project_name: gogrc

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# brew install sykesm/tap/gogrc
homebrew_casks:
  - name: gogrc
    repository:
      owner: sykesm
      name: homebrew-tap
      # A deploy key with write access to the tap only.
      git:
        url: git@github.com:sykesm/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: https://github.com/sykesm/gogrc
    description: Colorize command output using grc's configuration
    license: GPL-2.0-or-later
    binaries:
      - gogrc
    commit_msg_template: "gogrc {{ .Tag }}"
    hooks:
      post:
        # The binaries are not signed and notarized, so Gatekeeper would
        # refuse to run the quarantined download.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gogrc"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
